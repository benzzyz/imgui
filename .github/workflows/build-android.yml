name: Build libinjection.so (Android ARM64)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install JDK 17 first — sdkmanager requires it
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Download NDK directly — no sdkmanager, no version conflicts
      - name: Download NDK r26d
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip -d $HOME
          echo "NDK_PATH=$HOME/android-ndk-r26d" >> $GITHUB_ENV

      - name: Configure CMake (arm64-v8a)
        run: |
          cmake \
            -S unity_plugin \
            -B unity_plugin/build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_PATH }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build unity_plugin/build --parallel

      - name: Verify
        run: |
          file unity_plugin/build/libinjection.so
          ls -lh unity_plugin/build/libinjection.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libinjection-arm64-v8a
          path: unity_plugin/build/libinjection.so
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "libinjection.so arm64-v8a (build ${{ github.run_number }})"
          body: |
            **com.pixellabs.pixelstrike3d**
            ABI: arm64-v8a | Backend: OpenGL ES 3.0
            Commit: ${{ github.sha }}

            Drop into: Assets/Plugins/Android/arm64-v8a/libinjection.so
          files: unity_plugin/build/libinjection.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
